<script>
// ==========================================================================
// Plano Geral de Trabalho — uma interface única (passo 3e) com eventos (passo 3f, migração 0008).
//   Estados: FLUXO (fases encadeadas) e ILHAS (etapas avulsas + fases marcadas como ilha).
//   Cartões: fase › etapa › (entregas e eventos, numa sequência só) › material. Cada cartão tem ✎ e cadeado.
//   Entrega: o que se promete ao cliente; prazo com N pessoas, prazo fixo, e pode correr junto com a
//     entrega anterior (cluster: no prazo conta a mais longa).
//   Evento: marco de controle (reunião, apresentação, aprovação…); não vai ao contrato, mas pode ter uma
//     cláusula. Diz se o cliente participa e de quem é o tempo (só o do estúdio conta no prazo).
//   Encerramento: um cartão só, com instâncias nas etapas onde o serviço pode terminar; perpétuo (✓ cinza).
//   Prazo da etapa: a sequência (entregas P, clusters pela mais longa, eventos do estúdio que valem).
//   Tudo que se muda aqui vai para uma fila e só chega ao Universo em "Salvar" (ou Ctrl+S, ou ao
//   publicar). Criar e arquivar gravam na hora.
// ==========================================================================
let D0 = null;          // GET pgt (como está no servidor)
let D = null;           // D0 + fila
const aviso = avisoEm(document.getElementById('aviso'));
const TIPOS_MAT = [{ id: 'modelo', nome: 'Modelo' }, { id: 'formulario', nome: 'Formulário' }, { id: 'checklist', nome: 'Checklist' }, { id: 'referencia', nome: 'Referência' }];
const TIPOS_EVT = [{ id: 'reuniao', nome: 'Reunião' }, { id: 'apresentacao', nome: 'Apresentação' }, { id: 'envio', nome: 'Envio / recebimento' },
  { id: 'aprovacao', nome: 'Aprovação' }, { id: 'ajuste', nome: 'Rodada de ajuste' }, { id: 'visita', nome: 'Visita' },
  { id: 'protocolo', nome: 'Protocolo' }, { id: 'revisao', nome: 'Revisão interna' }];
const TEMPOS_EVT = [{ id: 'estudio', nome: 'Do estúdio (conta no prazo)' }, { id: 'cliente', nome: 'Do cliente (não conta)' },
  { id: 'terceiros', nome: 'De terceiros (não conta)' }, { id: 'pontual', nome: 'Pontual' }];
const TEMPO_CURTO = { estudio: 'tempo do estúdio', cliente: 'tempo do cliente', terceiros: 'tempo de terceiros', pontual: '' };
// prazos: em turnos (1 turno = 4 h; 1 dia = 2 turnos; 1 semana = 5 dias; 1 mês = 4 semanas)
const PRAZOS = [[0.5, '½ turno'], [1, '1 turno'], [2, '1 dia'], [4, '2 dias'], [6, '3 dias'], [8, '4 dias'], [10, '1 semana'],
  [15, '1½ semana'], [20, '2 semanas'], [30, '3 semanas'], [40, '1 mês']];
const PESSOAS = [1, 2, 3, 4, 5, 6];

async function carregar({ soNovo = false } = {}) {
  try {
    await Universo.lerComCache('pgt', (dados) => { D0 = dados; D0.eventos ||= []; montarD(); desenhar(); }, { soNovo });
  } catch (e) { aviso(`Não consegui carregar o Plano Geral de Trabalho (${mensagemDe(e)}).`); }
}
const recarregar = () => carregar({ soNovo: true });

const faseDe = (id) => D.fases.find((f) => f.id === id);
const etapaDe = (id) => D.etapas.find((e) => e.id === id);
const entDe = (id) => D.entregaveis.find((x) => x.id === id);
const evtDe = (id) => D.eventos.find((x) => x.id === id);
const srvDe = (id) => D.servicos.find((s) => s.id === id);
const materiaisDe = (alvo) => D.materiais.filter((m) => m.alvo_id === alvo);
const ENC = () => D.eventos.find((x) => x.encerramento);
const textoNbr = (e) => [e.nbr_nome ? `${e.nbr_nome}${e.nbr_sigla ? ` (${e.nbr_sigla})` : ''}` : '', e.nbr_nota || ''].filter(Boolean).join(' — ');
const TABELA = { pfa: 'pgt_fases', pet: 'pgt_etapas', pen: 'pgt_entregaveis', pev: 'pgt_eventos', pma: 'pgt_materiais' };
const tabelaDe = (id) => TABELA[String(id).slice(0, 3)];
const ehPasso = (id) => /^pe[nv]_/.test(String(id));   // entrega ou evento: vivem na sequência da etapa
const registroEm = (d, id) => (({ pgt_fases: d.fases, pgt_etapas: d.etapas, pgt_entregaveis: d.entregaveis, pgt_eventos: d.eventos, pgt_materiais: d.materiais })[tabelaDe(id)] || []).find((r) => r.id === id);

// ---------------------------------------------------------------- formatos de prazo
function meio(n) {
  if (Number.isInteger(n)) return String(n);
  if (Math.abs(n % 1 - 0.5) < 1e-9) return `${Math.floor(n) || ''}½`;
  return n.toLocaleString('pt-BR', { maximumFractionDigits: 1 });
}
function fmtPrazo(t) {
  if (!t) return '—';
  if (t < 2) return `${meio(t)} turno${t > 1 ? 's' : ''}`;
  if (t < 10) return `${meio(t / 2)} dia${t / 2 > 1 ? 's' : ''}`;
  if (t < 40) return `${meio(Math.round(t) / 10)} sem.`;
  return `${meio(Math.round(t / 4) / 10)} ${t / 40 > 1 ? 'meses' : 'mês'}`;
}

// ================================================================ fila de mudanças não salvas
//   pn: pertinência de entrega · pe: pertinência de evento · ed: campos · ct: categorias da entrega
//   or: ordem de etapas (por fase) e de materiais (por alvo) · sq: sequência de entregas e eventos (por etapa)
const FILA_CHAVE = 'pgt:fila:v3';
const FILA = new Map((() => { try { return JSON.parse(localStorage.getItem(FILA_CHAVE) || '[]'); } catch (_) { return []; } })());
try { localStorage.removeItem('pgt:fila'); localStorage.removeItem('pgt:fila:v2'); } catch (_) { /* formatos antigos */ }
function guardarFila() { try { localStorage.setItem(FILA_CHAVE, JSON.stringify([...FILA])); } catch (_) { /* sem armazenamento */ } }
const chaveDe = (op) => op.tipo === 'pn' ? `pn|${op.ent}|${op.srv}` : op.tipo === 'pe' ? `pe|${op.ev}|${op.srv}` : op.tipo === 'ed' ? `ed|${op.id}`
  : op.tipo === 'ct' ? `ct|${op.ent}` : op.tipo === 'sq' ? `sq|${op.grupo}` : `or|${op.tabela}|${op.grupo}`;
const PAI = { pgt_etapas: 'fase_id', pgt_entregaveis: 'etapa_id', pgt_eventos: 'etapa_id', pgt_materiais: 'alvo_id' };
const listaDe = (d, tabela) => ({ pgt_etapas: d.etapas, pgt_entregaveis: d.entregaveis, pgt_eventos: d.eventos, pgt_materiais: d.materiais })[tabela];

// entregas e eventos (sem o Encerramento) de uma etapa, na ordem
const ordemDaSequencia = (a, b) => (a.ordem - b.ordem) || ((ehEnt(a) ? 0 : 1) - (ehEnt(b) ? 0 : 1))
  || String(a.criado_em || '').localeCompare(String(b.criado_em || '')) || a.id.localeCompare(b.id);
const ehEnt = (x) => String(x.id).startsWith('pen_');
const passosEm = (d, etapaId) => [...d.entregaveis.filter((x) => x.etapa_id === etapaId), ...d.eventos.filter((x) => x.etapa_id === etapaId && !x.encerramento)];

function igualAoServidor(op) {
  if (op.tipo === 'pn') { const x = D0.entregaveis.find((y) => y.id === op.ent); return !x || (x.servicos[op.srv] || '') === (op.p || ''); }
  if (op.tipo === 'pe') { const x = D0.eventos.find((y) => y.id === op.ev); return !x || (x.servicos[op.srv] || '') === (op.p || ''); }
  if (op.tipo === 'ed') {
    const r = registroEm(D0, op.id);
    return !r || Object.entries(op.campos).every(([k, v]) => JSON.stringify(r[k] ?? '') === JSON.stringify(v ?? ''));
  }
  if (op.tipo === 'ct') { const x = D0.entregaveis.find((y) => y.id === op.ent); return !x || [...x.categorias].sort().join() === [...op.ids].sort().join(); }
  if (op.tipo === 'sq') return passosEm(D0, op.grupo).sort(ordemDaSequencia).map((r) => r.id).join() === op.ids.join();
  if (op.tipo === 'or') return listaDe(D0, op.tabela).filter((r) => r[PAI[op.tabela]] === op.grupo).map((r) => r.id).join() === op.ids.join();
  return false;
}
function aplicarOp(d, op) {
  if (op.tipo === 'pn' || op.tipo === 'pe') {
    const x = op.tipo === 'pn' ? d.entregaveis.find((y) => y.id === op.ent) : d.eventos.find((y) => y.id === op.ev); if (!x) return;
    if (op.p) x.servicos[op.srv] = op.p; else delete x.servicos[op.srv];
  } else if (op.tipo === 'ed') { const r = registroEm(d, op.id); if (r) Object.assign(r, op.campos); }
  else if (op.tipo === 'ct') { const x = d.entregaveis.find((y) => y.id === op.ent); if (x) x.categorias = [...op.ids]; }
}
// ordem: etapas por fase, materiais por alvo, entregas e eventos pela sequência da etapa; a fila manda
function ordenar(d) {
  const porGrupo = (lista, tabela) => {
    const grupos = new Map();
    for (const r of lista) { const g = r[PAI[tabela]]; if (!grupos.has(g)) grupos.set(g, []); grupos.get(g).push(r); }
    for (const [g, rs] of grupos) {
      const op = FILA.get(`or|${tabela}|${g}`);
      if (op) rs.sort((a, b) => (op.ids.indexOf(a.id) + 1 || 999) - (op.ids.indexOf(b.id) + 1 || 999));
    }
    return grupos;
  };
  const ge = porGrupo(d.etapas, 'pgt_etapas');
  d.etapas = d.fases.flatMap((f) => ge.get(f.id) || []);
  d.seq = {};
  for (const e of d.etapas) {
    const ps = passosEm(d, e.id).sort(ordemDaSequencia);
    const op = FILA.get(`sq|${e.id}`);
    if (op) ps.sort((a, b) => (op.ids.indexOf(a.id) + 1 || 999) - (op.ids.indexOf(b.id) + 1 || 999));
    d.seq[e.id] = ps;
  }
  d.entregaveis = d.etapas.flatMap((e) => d.seq[e.id].filter(ehEnt));
  d.eventos = [...d.etapas.flatMap((e) => d.seq[e.id].filter((x) => !ehEnt(x))), ...d.eventos.filter((x) => x.encerramento)];
  d.materiais = [...porGrupo(d.materiais, 'pgt_materiais').values()].flat();
}
// Prazo da etapa por serviço (mesma regra do Universo, prazosDaEtapa em pgt.js).
function prazosDaEtapa(passos, servicos) {
  const prazos = {}; const semPrazo = {};
  for (const srv of servicos) {
    let total = 0; let grupo = 0; let antesEntrega = false; let vale = false;
    for (const x of passos) {
      const p = x.servicos[srv];
      if (ehEnt(x)) {
        if (p !== 'P') continue;
        vale = true;
        const t = x.prazo_turnos || 0;
        if (!x.prazo_turnos) semPrazo[srv] = (semPrazo[srv] || 0) + 1;
        if (x.junto_anterior && antesEntrega) grupo = Math.max(grupo, t); else { total += grupo; grupo = t; }
        antesEntrega = true;
      } else {
        if (x.encerramento || (p !== 'P' && p !== 'S')) continue;
        total += grupo; grupo = 0; antesEntrega = false;
        if (x.tempo === 'estudio') total += x.prazo_turnos || 0;
      }
    }
    total += grupo;
    if (vale) prazos[srv] = total;
  }
  return { prazos, semPrazo };
}
// derivados: códigos, ✓ da etapa (das entregas), prazo da etapa por serviço, clusters
function derivar(d) {
  const servicos = d.servicos.map((s) => s.id);
  for (const e of d.etapas) {
    let nE = 0; let nM = 0; let antes = null;
    for (const x of d.seq[e.id]) {
      if (ehEnt(x)) {
        x.codigo = `${e.sigla}-${String(++nE).padStart(2, '0')}`;
        x.podeJuntar = !!antes && ehEnt(antes);      // a anterior na sequência é uma entrega
        x.noCluster = false;
      } else x.codigo = `${e.sigla}-M${String(++nM).padStart(2, '0')}`;
      antes = x;
    }
    const seq = d.seq[e.id];
    seq.forEach((x, i) => {
      if (!ehEnt(x) || !x.junto_anterior || !x.podeJuntar) return;
      x.noCluster = true; seq[i - 1].noCluster = true;
    });
    e.servicos = {};
    for (const x of seq.filter(ehEnt)) {
      for (const [srv, p] of Object.entries(x.servicos)) {
        if (p === 'P' || !e.servicos[srv]) e.servicos[srv] = { pertinencia: e.servicos[srv]?.pertinencia === 'P' ? 'P' : p };
      }
    }
    Object.assign(e, prazosDaEtapa(seq, servicos));
  }
  const enc = d.eventos.find((x) => x.encerramento);
  if (enc) enc.codigo = 'ENC';
}
function montarD() {
  for (const [k, op] of FILA) if (igualAoServidor(op)) FILA.delete(k);
  guardarFila();
  D = structuredClone(D0);
  for (const op of FILA.values()) aplicarOp(D, op);
  ordenar(D); derivar(D);
}
function mudar(op, { redesenhar = false } = {}) {
  const k = chaveDe(op);
  if (op.tipo === 'ed' && FILA.has(k)) op = { ...op, campos: { ...FILA.get(k).campos, ...op.campos } };
  if (igualAoServidor(op)) FILA.delete(k); else FILA.set(k, op);
  aplicarOp(D, op);
  guardarFila();
  if (redesenhar) { ordenar(D); derivar(D); desenhar(); } else desenharFila();
}
function esquecerDaFila(filtro) { for (const [k, op] of FILA) if (filtro(op)) FILA.delete(k); guardarFila(); }

function desenharFila() {
  const el = document.getElementById('fila');
  const n = FILA.size;
  el.hidden = !n;
  if (n) {
    el.innerHTML = `<span><strong>${n} mudança${n > 1 ? 's' : ''}</strong> ainda não salva${n > 1 ? 's' : ''}</span>
      <button type="button" class="btn btn--small" id="fila-salvar">Salvar</button>
      <button type="button" class="btn-link" id="fila-descartar">descartar</button>
      <span class="small" style="opacity:.75">Ctrl+S salva</span>`;
    el.querySelector('#fila-salvar').onclick = () => salvar();
    el.querySelector('#fila-descartar').onclick = () => {
      if (!confirm(`Descartar ${n} mudança${n > 1 ? 's' : ''} não salva${n > 1 ? 's' : ''}?`)) return;
      FILA.clear(); guardarFila(); montarD(); desenhar();
    };
  }
  desenharPub();
}

let salvando = null;
async function salvar() {
  if (salvando) return salvando;
  if (!FILA.size) return;
  salvando = (async () => {
    const ops = [...FILA.values()];
    document.querySelectorAll('#fila button').forEach((b) => { b.disabled = true; });
    const lote = [];
    for (const op of ops.filter((o) => o.tipo === 'ed')) {
      const r = registroEm(D0, op.id);
      if (r) lote.push({ tipo: 'campos', tabela: tabelaDe(op.id), id: op.id, versao: r.versao, campos: op.campos });
    }
    const grupos = {};
    for (const op of ops.filter((o) => o.tipo === 'pn' || o.tipo === 'pe')) (grupos[`${op.tipo}|${op.srv}|${op.p || ''}`] ||= []).push(op.ent || op.ev);
    for (const [k, ids] of Object.entries(grupos)) {
      const [tipo, srv, p] = k.split('|');
      for (let i = 0; i < ids.length; i += 200) {
        lote.push(tipo === 'pn'
          ? { tipo: 'entregaveis-servicos', servico_id: srv, pertinencia: p || null, entregavel_ids: ids.slice(i, i + 200) }
          : { tipo: 'eventos-servicos', servico_id: srv, pertinencia: p || null, evento_ids: ids.slice(i, i + 200) });
      }
    }
    for (const op of ops.filter((o) => o.tipo === 'ct')) lote.push({ tipo: 'entregaveis-categorias', entregavel_id: op.ent, categorias: op.ids });
    for (const op of ops.filter((o) => o.tipo === 'or')) {
      const ids = listaDe(D, op.tabela).filter((r) => r[PAI[op.tabela]] === op.grupo).map((r) => r.id);
      if (ids.length) lote.push({ tipo: 'ordem', tabela: op.tabela, ids });
    }
    for (const op of ops.filter((o) => o.tipo === 'sq')) {
      const ids = (D.seq[op.grupo] || []).map((r) => r.id);
      if (ids.length) lote.push({ tipo: 'sequencia', etapa_id: op.grupo, ids });
    }
    try {
      for (let i = 0; i < lote.length; i += 500) await Universo.post('pgt/lote', { ops: lote.slice(i, i + 500) });
      FILA.clear(); guardarFila();
      aviso('Mudanças salvas.', 'ok');
      setTimeout(() => aviso(''), 2500);
    } catch (err) {
      aviso(`Nem tudo foi salvo (${mensagemDe(err)}). O que ficou pendente continua na barra.`);
    }
    await recarregar();
  })();
  try { await salvando; } finally { salvando = null; }
}
document.addEventListener('keydown', (ev) => {
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 's') { ev.preventDefault(); salvar(); }
});
window.addEventListener('beforeunload', (ev) => { if (FILA.size) { ev.preventDefault(); ev.returnValue = ''; } });

// ================================================================ filtros (valem para as duas abas)
function filtro() {
  return { srv: servicoFixo() || document.getElementById('f-servico').value, eta: document.getElementById('f-etapa').value,
    q: semAcento(document.getElementById('f-texto').value.trim()), todos: document.getElementById('f-todos').checked };
}
const filtrando = () => { const f = filtro(); return !!((f.srv && !servicoFixo()) || f.eta || f.q); };
const passoVisivel = (x, f) => (!f.srv || f.todos || x.servicos[f.srv]) && (!f.q || semAcento(x.codigo + ' ' + (x.texto || x.nome)).includes(f.q));
const etapaCasa = (e, f) => !f.q || semAcento(e.sigla + ' ' + e.nome).includes(f.q);
function montarFiltros() {
  const fs = document.getElementById('f-servico'); const fe = document.getElementById('f-etapa');

  const sv = servicosDaVista();
  fs.innerHTML = '<option value="">Todos os serviços</option>' + sv.map((s) => `<option value="${s.id}">${escHtml(s.sigla + ' · ' + s.nome)}</option>`).join('');
  fe.innerHTML = '<option value="">Todas as etapas</option>' + etapasDaVista().map((e) => `<option value="${e.id}">${escHtml(e.sigla + ' · ' + e.nome)}</option>`).join('');

  fs.value = sv.some((x) => x.id === vs) ? vs : ''; fe.value = etapasDaVista().some((e) => e.id === ve) ? ve : '';

}

const ABERTOS_CHAVE = 'pgt:abertos';
const ABERTOS = new Set((() => { try { return JSON.parse(sessionStorage.getItem(ABERTOS_CHAVE) || '[]'); } catch (_) { return []; } })());
const EDITANDO = new Set();
function guardarAbertos() { try { sessionStorage.setItem(ABERTOS_CHAVE, JSON.stringify([...ABERTOS])); } catch (_) { /* sem armazenamento */ } }
// o Encerramento aparece em várias etapas: a chave do cartão aberto inclui a etapa (pev_encerramento@pet_pe)
function alternarAberto(id) { ABERTOS.has(id) ? ABERTOS.delete(id) : ABERTOS.add(id); guardarAbertos(); desenharPlano(); }

// cadeado: o do próprio cartão ou o de quem está acima
function travado(id) {
  const r = registroEm(D, id);
  if (!r) return false;
  if (r.travado) return true;
  if (r.etapa_id && !r.encerramento) return travado(r.etapa_id);
  if (r.fase_id) return travado(r.fase_id);
  if (r.alvo_id) return travado(r.alvo_id);
  return false;
}

// alça, ✎ e cadeado, à esquerda do cartão
function controles(id, { alca = false } = {}) {
  const r = registroEm(D, id);
  const trv = travado(id);
  const herdado = !r.travado && trv;
  return `<div class="ctl">
    ${alca ? `<button type="button" class="alca" data-alca="${id}" title="Arrastar para mudar a posição (ou Alt+↑/↓)" aria-label="Mover" ${trv ? 'disabled' : ''}>⋮⋮</button>` : '<span class="ctl__vazio"></span>'}
    <button type="button" class="ctl__btn${EDITANDO.has(id) ? ' is-on' : ''}" data-editar="${id}" title="${trv ? 'Travado' : EDITANDO.has(id) ? 'Concluir edição' : 'Editar'}" aria-pressed="${EDITANDO.has(id)}" ${trv ? 'disabled' : ''}>${ICONE.lapis}</button>
    <button type="button" class="ctl__btn${r.travado ? ' is-on' : ''}${herdado ? ' is-herdado' : ''}" data-travar="${id}" aria-pressed="${!!r.travado}"
      title="${herdado ? 'Travado pelo cartão de cima' : r.travado ? 'Destravar' : 'Travar contra edições'}" ${herdado ? 'disabled' : ''}>${trv ? ICONE.cadeado : ICONE.aberto}</button>
  </div>`;
}
const botaoAbre = (n, chave, aberto, titulo) =>
  `<button type="button" class="contagem${n ? '' : ' is-zero'}${aberto ? ' is-aberto' : ''}" data-abre="${chave}" title="${escHtml(titulo)}" aria-expanded="${aberto}">${aberto ? ICONE.seta : n}</button>`;
const celulaFixa = (p, titulo, origem = 'vem das entregas') => `<span class="pert pert--calc" data-p="${p || ''}" title="${escHtml(titulo)}: ${escHtml(nomeDe(PERTINENCIAS, p || ''))} (${origem})">${MARCA_PERT[p || '']}</span>`;
const seletorPrazo = (x, dis) => `<select data-prazo="${x.id}" aria-label="Prazo de ${escHtml(x.codigo)}" ${dis}><option value="">prazo</option>${PRAZOS.map(([v, n]) => `<option value="${v}" ${x.prazo_turnos === v ? 'selected' : ''}>${n}</option>`).join('')}</select>`;

let S = [];   // serviços visíveis (filtro)
function prazoEtapa(e) {
  const vs = S.filter((s) => e.servicos[s.id] && e.prazos[s.id] > 0).map((s) => e.prazos[s.id]);
  const falta = S.some((s) => e.semPrazo[s.id]);
  if (!vs.length) return `<span class="muted"${falta ? ' title="Entregas ainda sem prazo"' : ''}>—${falta ? '<sup>*</sup>' : ''}</span>`;
  const min = Math.min(...vs); const max = Math.max(...vs);
  const txt = min === max ? fmtPrazo(min) : `${fmtPrazo(min)} – ${fmtPrazo(max)}`;
  return `<span class="prazo-soma" title="Sequência da etapa: entregas que vêm marcadas (as que correm juntas contam pela mais longa) e eventos do estúdio${S.length > 1 ? '; faixa entre os serviços' : ''}${falta ? '; há entregas sem prazo' : ''}">${txt}${falta ? '<sup>*</sup>' : ''}</span>`;
}

function desenharPlano() {
  const f = filtro();
  const vista = vistaDoPlano();          // 'fluxo' | 'ilhas' (ver pgt-servicos.js)
  const el = document.getElementById('plano');
  if (!vista) { el.innerHTML = ''; return; }
  const sv = servicosDaVista();
  S = f.srv ? sv.filter((s) => s.id === f.srv) : vista === 'ilhas' ? [] : sv;
  const arrasta = !filtrando();
  const grade = (n) => `84px 72px minmax(0,1fr) 196px ${n ? `repeat(${n}, 36px)` : ''} 96px`;
  const cab = (lista) => `<div class="plano-cab grade" style="--cols:${grade(lista.length)}">
    <span style="grid-column:2;grid-row:2">Sigla<span class="th-sub">/ código</span></span>
    <span style="grid-column:3;grid-row:2">Etapa<span class="th-sub">/ entrega ou evento</span></span>

  </div>`;

  const etapasVisiveis = (faseId, dono) => D.etapas.filter((e) => e.fase_id === faseId && (dono === undefined ? !e.servico_id : e.servico_id === dono)
    && (!f.eta || e.id === f.eta)
    && (!f.srv || f.todos || e.servicos[f.srv] || dono)
    && (etapaCasa(e, f) || D.seq[e.id].some((x) => passoVisivel(x, f)) || (dono && !f.q)));
  const blocoFase = (fa) => {
    const etapas = etapasVisiveis(fa.id);
    if (filtrando() && !etapas.length) return '';
    const trv = travado(fa.id);
    const ed = EDITANDO.has(fa.id) && !trv;
    const prazos = S.map((s) => etapas.reduce((t, e) => t + (e.servicos[s.id] ? (e.prazos[s.id] || 0) : 0), 0)).filter((n) => n > 0);
    return `<div class="fase${trv ? ' is-travado' : ''}" data-fase="${fa.id}">
      <div class="fase__cab grade">
        ${controles(fa.id)}
        <div class="fase__estado"></div>
        <div class="fase__textos">
          ${ed ? `<input class="fase__nome-in" data-campo-de="${fa.id}" data-campo="nome" value="${escHtml(fa.nome)}" aria-label="Nome da fase">
                 <textarea class="fase__desc-in" data-campo-de="${fa.id}" data-campo="descricao" rows="2" placeholder="Descrição da fase: o texto que a explica na proposta comercial">${escHtml(fa.descricao || '')}</textarea>`
               : `<h3 class="fase__nome${trv ? '' : ' editavel'}" data-editar-texto="${fa.id}">${escHtml(fa.nome)}</h3>
                  <p class="fase__desc${trv ? '' : ' editavel'}" data-editar-texto="${fa.id}">${fa.descricao ? escHtml(fa.descricao) : '<span class="muted">Sem descrição.</span>'}</p>`}
        </div>
        <div class="centro fase__prazo">${prazos.length ? `<span title="Soma das etapas (faixa entre os serviços)">${fmtPrazo(Math.min(...prazos))}${Math.min(...prazos) !== Math.max(...prazos) ? ' – ' + fmtPrazo(Math.max(...prazos)) : ''}</span>` : ''}</div>
      </div>
      <div class="pilha" data-pilha="pgt_etapas" data-grupo="${fa.id}">${etapas.map((e) => cartaoEtapa(e, f, arrasta)).join('')}</div>
      ${filtrando() || trv ? '' : novoInline('etapa', fa.id, `+ Nova etapa em ${fa.nome}`)}
    </div>`;
  };
  // uma ilha: o serviço e as etapas dele (o nome e a sigla se editam na Ficha do serviço)
  const blocoIlha = (srv) => {
    const solta = D.fases.find((fa) => fa.solta);
    if (!solta) return '';
    const etapas = etapasVisiveis(solta.id, srv.id);
    if (filtrando() && !etapas.length) return '';
    const antes = S; S = [srv];
    const html = `<div class="fase fase--ilha" data-ilha-srv="${srv.id}" style="--cols:${grade(1)}">
      <div class="fase__cab grade">
        <div class="ctl"><button type="button" class="ctl__btn" data-editar-srv="${srv.id}" title="Editar sigla e nome de ${escHtml(srv.sigla)}" aria-label="Editar o serviço">${ICONE.lapis}</button></div>
        <div class="fase__estado"><span class="sigla">${escHtml(srv.sigla)}</span></div>
        <div class="fase__textos"><h3 class="fase__nome">${escHtml(srv.nome)}</h3></div>
        <div class="centro fase__prazo">${(() => { const t = etapas.reduce((n, e) => n + (e.prazos[srv.id] || 0), 0); return t ? fmtPrazo(t) : ''; })()}</div>
      </div>
      <div class="pilha" data-pilha="pgt_etapas" data-grupo="${solta.id}">${etapas.map((e) => cartaoEtapa(e, f, arrasta)).join('')

      ${filtrando() ? '' : novoInline('etapa', solta.id, `+ Nova etapa em ${srv.sigla}`, srv.id)}

    const htmlIlhas = ilhas.map(blocoIlha).join('');
    el.innerHTML = `<div class="plano" style="--cols:${grade(1)}">${cab([{ sigla: '', nome: 'Serviço da ilha' }])}

  lnDesenharModal();     // o cartão aberto em popup na aba Linha acompanha as mudanças
}

function cartaoEtapa(e, f, arrasta) {
  if (e.servico_id) { const antes = S; S = [srvDe(e.servico_id)].filter(Boolean); try { return cartaoEtapa0(e, f, arrasta); } finally { S = antes; } }
  return cartaoEtapa0(e, f, arrasta);
}

          <label>Descrição (vai no contrato)<textarea data-campo-de="${e.id}" data-campo="descricao" rows="3">${escHtml(e.descricao || '')}</textarea></label>
          <div class="campos campos--3"><label>Nome na NBR 16636<input data-campo-de="${e.id}" data-campo="nbr_nome" value="${escHtml(e.nbr_nome || '')}"></label>

          <div class="card__acoes"><button type="button" class="btn btn--ghost btn--small" data-editar="${e.id}">Concluir</button>

      <div class="pilha" data-pilha="seq" data-grupo="${e.id}">${passos.map((x) => ehEnt(x) ? cartaoEnt(x, arrasta) : cartaoEvento(x, arrasta)).join('')}</div>
      ${trv || filtrando() ? '' : `<div class="novos">${novoInline('entregavel', e.id, `+ Nova entrega em ${e.sigla}`)}${novoInline('evento', e.id, `+ Novo evento em ${e.sigla}`)}</div>`}
      ${temEnc ? cartaoEncerramento(enc, e) : ''}
      ${blocoMateriais(e.id, 'Materiais da etapa', arrasta)}
    </div>`;
  }
  const nEnt = D.seq[e.id].filter(ehEnt).length; const nEvt = D.seq[e.id].length - nEnt;
  return `<div class="card card--etapa${aberto ? ' is-aberto' : ''}${trv ? ' is-travado' : ''}" data-card="${e.id}" ${arrasta && !trv ? 'draggable="true"' : ''}>
    <div class="linha grade" data-abre-linha="${e.id}">
      ${controles(e.id, { alca: arrasta })}
      <div class="sigla">${escHtml(e.sigla)}</div>
      <div><strong>${escHtml(e.nome)}</strong>${info(nbr)}${temEnc && enc.etapa_id === e.id ? ' <span class="chip chip--enc" title="O serviço termina aqui por padrão">encerramento</span>' : ''}</div>
      <div class="centro">${prazoEtapa(e)}</div>
      ${S.map((s) => `<div class="centro">${celulaFixa(e.servicos[s.id]?.pertinencia || '', `${e.sigla} em ${s.sigla}`)}</div>`).join('')}

function cartaoEnt(x, arrasta) {
  if (MARCANDO) return cartaoMarcavel(x);
  const aberto = ABERTOS.has(x.id) || EDITANDO.has(x.id);
  const trv = travado(x.id);
  const ed = EDITANDO.has(x.id) && !trv;
  const nomeCat = (id) => (D.categorias.find((c) => c.id === id) || {}).nome || id;
  const dis = trv ? 'disabled' : '';
  const junto = !!x.junto_anterior && x.podeJuntar;
  const cabeca = x.noCluster && !junto;   // primeira entrega do grupo que corre junto: o símbolo forte
  let corpo = '';
  if (aberto) {
    corpo = `<div class="card__corpo">
      ${ed ? `<div class="card__form">
          <label>Texto (como vai no contrato)<input data-campo-de="${x.id}" data-campo="texto" value="${escHtml(x.texto)}"></label>
          <label>Observações (uso interno)<textarea data-campo-de="${x.id}" data-campo="observacoes" rows="2">${escHtml(x.observacoes || '')}</textarea></label>
          <fieldset class="card__cats"><legend>Só para estas categorias de tipologia (nenhuma marcada = todas)</legend>
            ${D.categorias.map((c) => `<label class="small"><input type="checkbox" data-cat-de="${x.id}" value="${c.id}" ${x.categorias.includes(c.id) ? 'checked' : ''}> ${escHtml(c.nome)}</label>`).join('')}</fieldset>
          <div class="card__acoes"><button type="button" class="btn btn--ghost btn--small" data-editar="${x.id}">Concluir</button>
            <button type="button" class="btn-link perigo" data-arquivar="${x.id}">arquivar entrega</button></div>
        </div>`
      : `<div class="card__info">
          ${x.observacoes ? `<p>${escHtml(x.observacoes)}</p>` : ''}
          <p class="small muted">${x.categorias.length ? `Só em: ${x.categorias.map((c) => escHtml(nomeCat(c))).join(', ')}.` : 'Vale para todas as tipologias.'}
            ${x.prazo_turnos ? ` Esforço: ${fmtPrazo(x.prazo_turnos * x.pessoas)} de trabalho (${fmtPrazo(x.prazo_turnos)} × ${x.pessoas} pessoa${x.pessoas > 1 ? 's' : ''}).` : ' Sem prazo definido.'}
            ${x.prazo_fixo ? ' Prazo fixo: mais pessoas não encurtam.' : ''}
            ${junto ? ' Corre junto com a entrega anterior: no prazo da etapa conta a mais longa.' : ''}</p>

      ${blocoMateriais(x.id, '', arrasta)}
    </div>`;
  }
  return `<div class="card card--ent${aberto ? ' is-aberto' : ''}${trv ? ' is-travado' : ''}${x.noCluster ? ' is-cluster' : ''}${junto ? ' is-junto' : ''}" data-card="${x.id}" ${arrasta && !trv ? 'draggable="true"' : ''}>
    <div class="linha grade" data-abre-linha="${x.id}">
      ${controles(x.id, { alca: arrasta })}
      <div class="codigo">${escHtml(x.codigo)}</div>
      <div>${escHtml(x.texto)}${x.categorias.length ? ` <span class="small muted">· só em ${x.categorias.length} categoria${x.categorias.length > 1 ? 's' : ''}</span>` : ''} ${seloSuspenso(x.id)}</div>
      <div class="prazo-ctl">
        <button type="button" class="junto${junto ? ' is-on' : ''}${cabeca ? ' is-cabeca' : ''}" data-junto="${x.id}" aria-pressed="${junto}" ${dis || (x.podeJuntar ? '' : cabeca ? 'aria-disabled="true"' : 'disabled')}
          title="${cabeca ? `Primeira entrega do grupo que corre junto${x.podeJuntar ? ' (clique para ligar também à entrega de cima)' : ''}` : !x.podeJuntar ? 'Só junta com uma entrega logo acima' : junto ? 'Corre junto com a entrega de cima (clique para separar)' : 'Correr junto com a entrega de cima'}">${ICONE.junto}</button>
        ${seletorPrazo(x, dis)}
        <select data-pessoas="${x.id}" aria-label="Pessoas em ${escHtml(x.codigo)}" title="Pessoas" ${dis}>${PESSOAS.map((n) => `<option value="${n}" ${x.pessoas === n ? 'selected' : ''}>${n} p.</option>`).join('')}</select>
        <button type="button" class="fixo${x.prazo_fixo ? ' is-on' : ''}" data-fixo="${x.id}" aria-pressed="${!!x.prazo_fixo}" ${dis}
          title="${x.prazo_fixo ? 'Prazo fixo: mais pessoas não encurtam (clique para liberar)' : 'Prazo varia com as pessoas (clique para fixar)'}">${ICONE.fixo}</button>
      </div>
      ${S.map((s) => `<div class="centro">${celulaPert(x.servicos[s.id] || '', `${x.codigo} em ${s.sigla}`, `data-ent="${x.id}" data-srv="${s.id}" ${dis}`)}</div>`).join('')}
      <div class="centro">${botaoAbre(materiaisDe(x.id).length, x.id, aberto, aberto ? 'Fechar' : `Ver os materiais de ${x.codigo}`)}</div>
    </div>${corpo}</div>`;
}

// ================================================================ decisões (0009)
//   Um evento de decisão tem 2 a 4 resultados; o primeiro é o caminho esperado. Cada resultado aponta os
//   cartões RELACIONADOS que saem de suspensão quando ele é escolhido (no projeto). Aqui se marcam.
//   MARCANDO = { ev, res }: o plano vira uma lista de cartões clicáveis até "Concluir".
let MARCANDO = null;
const codigoDe = (id) => (entDe(id) || evtDe(id))?.codigo || id;
// quem suspende este cartão: { ev, res } ou null
function suspensoPor(id) {
  for (const v of D.eventos) for (const r of v.decisao || []) if (r.libera.includes(id)) return { ev: v, res: r };
  return null;
}
function seloSuspenso(id) {
  const s = suspensoPor(id);
  return s ? `<span class="chip chip--susp" title="Fica suspenso até a decisão de ${escHtml(s.ev.codigo)}; entra se o resultado for «${escHtml(s.res.nome)}»">suspenso · ${escHtml(s.ev.codigo)} → ${escHtml(s.res.nome)}</span>` : '';
}
const novoIdResultado = () => 'r' + Math.random().toString(36).slice(2, 7);
function mudarDecisao(v, decisao) {
  mudar({ tipo: 'ed', id: v.id, campos: { decisao } }, { redesenhar: true });
}
function formDecisao(v) {
  const d = v.decisao;
  return `<fieldset class="card__cats dec-form"><legend><label><input type="checkbox" data-dec-liga="${v.id}" ${d ? 'checked' : ''}> evento de decisão</label></legend>
    ${d ? `<p class="small muted">O primeiro resultado é o caminho esperado. Os cartões relacionados ficam suspensos e só entram no projeto se sair o resultado que os libera.</p>
      ${d.map((r, i) => `<div class="dec-res">
        <input data-dec-nome="${v.id}|${i}" value="${escHtml(r.nome)}" maxlength="60" aria-label="Resultado ${i + 1}" placeholder="Resultado">
        <span class="dec-rel">${r.libera.length ? r.libera.map((id) => `<span class="chip">${escHtml(codigoDe(id))}</span>`).join(' ') : `<span class="small muted">${i === 0 ? 'segue o fluxo' : 'sem relacionados'}</span>`}</span>
        <button type="button" class="btn btn--ghost btn--small" data-dec-marcar="${v.id}|${i}">marcar relacionados</button>
        ${d.length > 2 ? `<button type="button" class="btn-link perigo" data-dec-tirar="${v.id}|${i}" title="Tirar este resultado">×</button>` : ''}
      </div>`).join('')}
      ${d.length < 4 ? `<button type="button" class="btn-link" data-dec-mais="${v.id}">+ resultado</button>` : ''}` : ''}
  </fieldset>`;
}
function desenharMarcando() {
  const el = document.getElementById('marcando');
  if (!MARCANDO) { el.innerHTML = ''; return; }
  const v = evtDe(MARCANDO.ev); const r = v.decisao[MARCANDO.res];
  el.innerHTML = `<div class="marcando"><span>${ICONE.decisao} Marcando os cartões que entram com <strong>«${escHtml(r.nome)}»</strong> em ${escHtml(v.codigo)}.
    Clique nos cartões para marcar ou desmarcar.</span>
    <button type="button" class="btn btn--small" id="marcando-ok">Concluir</button></div>`;
  el.querySelector('#marcando-ok').onclick = () => { MARCANDO = null; desenharMarcando(); desenharPlano(); };
}
// no modo de marcação, cada entrega ou evento vira uma linha com caixa
function cartaoMarcavel(x) {
  const v = evtDe(MARCANDO.ev);
  const marcado = v.decisao[MARCANDO.res].libera.includes(x.id);
  const outro = !marcado && v.decisao.find((r) => r.libera.includes(x.id));
  const pode = x.id !== v.id && !x.encerramento;
  return `<div class="card card--marca${marcado ? ' is-marcado' : ''}${pode ? '' : ' is-fora'}" data-marca="${pode ? x.id : ''}">
    <div class="linha grade"><div class="ctl"><span class="marca-caixa">${marcado ? '✓' : ''}</span></div>
      <div class="codigo">${escHtml(x.codigo)}</div><div>${escHtml(x.texto || x.nome)}${outro ? ` <span class="small muted">· hoje em «${escHtml(outro.nome)}»</span>` : ''}${x.id === v.id ? ' <span class="small muted">· o próprio evento</span>' : ''}</div></div></div>`;
}
function alternarMarcado(id) {
  const v = evtDe(MARCANDO.ev);
  const d = v.decisao.map((r, i) => ({ ...r, libera: i === MARCANDO.res
    ? (r.libera.includes(id) ? r.libera.filter((y) => y !== id) : [...r.libera, id])
    : r.libera.filter((y) => y !== id) }));
  mudarDecisao(v, d);
}
function ligarDecisao(el) {
  el.querySelectorAll('[data-dec-liga]').forEach((c) => c.onchange = () => {
    const v = evtDe(c.dataset.decLiga);
    mudarDecisao(v, c.checked ? [{ id: 'aprovado', nome: 'Aprovado', libera: [] }, { id: novoIdResultado(), nome: 'Ajustes', libera: [] }] : null);
  });
  el.querySelectorAll('[data-dec-nome]').forEach((c) => c.addEventListener('input', () => {
    const [id, i] = c.dataset.decNome.split('|'); const v = evtDe(id); const nome = c.value.trim();
    if (!nome) return;
    mudar({ tipo: 'ed', id, campos: { decisao: v.decisao.map((r, k) => k === Number(i) ? { ...r, nome } : r) } });
  }));
  el.querySelectorAll('[data-dec-mais]').forEach((b) => b.onclick = () => {
    const v = evtDe(b.dataset.decMais);
    mudarDecisao(v, [...v.decisao, { id: novoIdResultado(), nome: `Resultado ${v.decisao.length + 1}`, libera: [] }]);
  });
  el.querySelectorAll('[data-dec-tirar]').forEach((b) => b.onclick = () => {
    const [id, i] = b.dataset.decTirar.split('|'); const v = evtDe(id);
    mudarDecisao(v, v.decisao.filter((_, k) => k !== Number(i)));
  });
  el.querySelectorAll('[data-dec-marcar]').forEach((b) => b.onclick = () => {
    const [ev, i] = b.dataset.decMarcar.split('|');
    MARCANDO = { ev, res: Number(i) };
    const v = evtDe(ev); ABERTOS.add(v.etapa_id);
    const prox = D.etapas[D.etapas.findIndex((e) => e.id === v.etapa_id) + 1];   // a etapa seguinte também, aberta
    if (prox) ABERTOS.add(prox.id);
    guardarAbertos(); desenharMarcando(); desenharPlano();
    document.getElementById('marcando').scrollIntoView({ block: 'nearest' });
  });
  el.querySelectorAll('[data-marca]').forEach((c) => c.onclick = (ev) => {
    ev.stopPropagation();
    if (c.dataset.marca) alternarMarcado(c.dataset.marca);
  });
  el.querySelectorAll('[data-ir]').forEach((a) => a.onclick = (ev) => { ev.preventDefault(); ev.stopPropagation(); irAoCartao(a.dataset.ir); });
}

// selos do evento: tipo, cliente, tempo, quantidade

function formEvento(v) {

    <div class="campos campos--3">

        <span><input type="checkbox" data-campo-sn="${v.id}" data-campo="terceiros" ${v.terceiros ? 'checked' : ''}> com participação de terceiros</span></label></div>

    ${v.encerramento ? '' : `<label class="check-linha"><span><input type="checkbox" data-campo-sn="${v.id}" data-campo="clausula_marcada" ${v.clausula_marcada ? 'checked' : ''}> é cláusula</span>
      <span class="small muted">O texto se redige no vendas, em <a href="/vendas/contratos.html#clausulas" >Contratos › Gestor de cláusulas</a>.</span></label>`}
    <label>Observações (uso interno)<textarea data-campo-de="${v.id}" data-campo="observacoes" rows="2">${escHtml(v.observacoes || '')}</textarea></label>

      ${D.etapas.map((e) => `<label class="small"><input type="checkbox" data-inst="${e.id}" ${(v.instancias || []).includes(e.id) ? 'checked' : ''} ${e.id === v.etapa_id ? 'disabled title="Instância ativa"' : ''}> ${escHtml(e.sigla)}</label>`).join('')}</fieldset>` : ''}
    <div class="card__acoes"><button type="button" class="btn btn--ghost btn--small" data-editar="${v.id}">Concluir</button>
      ${v.encerramento ? '' : `<button type="button" class="btn-link perigo" data-arquivar="${v.id}">arquivar evento</button>`}</div>

}
function infoEvento(v) {
  return `<div class="card__info">
    ${v.clausula_marcada ? '<p><strong>É cláusula.</strong> <span class="small muted">Texto no vendas › Contratos › Gestor de cláusulas.</span></p>' : ''}
    ${v.decisao ? `<p><strong>Decisão:</strong> ${v.decisao.map((r, i) => `${escHtml(r.nome)}${i === 0 ? ' <span class="muted">(caminho esperado)</span>' : ''}${r.libera.length
      ? ` → libera ${r.libera.map((id) => `<a href="#" data-ir="${id}">${escHtml(codigoDe(id))}</a>`).join(', ')}` : ''}`).join(' · ')}</p>` : ''}
    ${suspensoPor(v.id) ? `<p class="small">${seloSuspenso(v.id)}</p>` : ''}
    ${v.observacoes ? `<p>${escHtml(v.observacoes)}</p>` : ''}
    <p class="small muted">${v.cliente ? 'Com participação do cliente.' : 'Interno (sem o cliente).'}
      ${v.tempo === 'estudio' ? ` Tempo do estúdio: ${v.prazo_turnos ? `${fmtPrazo(v.prazo_turnos)}, somado ao prazo da etapa` : 'sem duração definida'}.` : v.tempo === 'pontual' ? ' Pontual.' : ` ${TEMPO_CURTO[v.tempo][0].toUpperCase() + TEMPO_CURTO[v.tempo].slice(1)}: aparece na linha do tempo, mas não conta no prazo do estúdio.`}
      ${v.quantidade ? ` Inclui ${v.quantidade}; as que passarem disso são extras no projeto.` : ''}</p>
  </div>`;
}
function cartaoEvento(v, arrasta) {
  if (MARCANDO) return cartaoMarcavel(v);
  const aberto = ABERTOS.has(v.id) || EDITANDO.has(v.id);
  const trv = travado(v.id);
  const ed = EDITANDO.has(v.id) && !trv;
  const dis = trv ? 'disabled' : '';
  return `<div class="card card--evt${aberto ? ' is-aberto' : ''}${trv ? ' is-travado' : ''}" data-card="${v.id}" ${arrasta && !trv ? 'draggable="true"' : ''}>
    <div class="linha grade" data-abre-linha="${v.id}">
      ${controles(v.id, { alca: arrasta })}
      <div class="codigo">${escHtml(v.codigo)}</div>
      <div class="evt__nome">${escHtml(v.nome)} ${selosEvento(v)} ${seloSuspenso(v.id)}</div>
      <div class="prazo-ctl">${v.tempo === 'estudio' ? seletorPrazo(v, dis) : ''}</div>
      ${S.map((s) => `<div class="centro">${celulaPert(v.servicos[s.id] || '', `${v.codigo} em ${s.sigla}`, `data-evt="${v.id}" data-srv="${s.id}" ${dis}`)}</div>`).join('')}
      <div class="centro">${botaoAbre(materiaisDe(v.id).length, v.id, aberto, aberto ? 'Fechar' : `Ver os materiais de ${v.codigo}`)}</div>
    </div>${aberto ? `<div class="card__corpo">${ed ? formEvento(v) : infoEvento(v)}${blocoMateriais(v.id, '', arrasta)}</div>` : ''}</div>`;
}
// Encerramento: a mesma ficha em cada etapa-instância; ativo onde está (etapa_id), suspenso nas outras
function cartaoEncerramento(v, e) {
  const chave = `${v.id}@${e.id}`;
  const ativo = v.etapa_id === e.id;
  const aberto = ABERTOS.has(chave) || EDITANDO.has(v.id) && ativo;
  const trv = travado(v.id);
  const ed = EDITANDO.has(v.id) && ativo && !trv;
  return `<div class="card card--enc${ativo ? ' is-ativo' : ' is-suspenso'}${aberto ? ' is-aberto' : ''}" data-card-enc="${e.id}">
    <div class="linha grade" data-abre-linha="${chave}">
      ${ativo ? controles(v.id) : '<div class="ctl"><span class="ctl__vazio"></span></div>'}
      <div class="codigo">ENC</div>
      <div class="evt__nome">${escHtml(v.nome)} ${selosEvento(v)}
        ${ativo ? '<span class="chip chip--estado" title="Instância ativa: o serviço termina aqui (padrão do PGT)">ativo</span>'
          : `<span class="chip chip--estado is-suspenso" title="Instância suspensa: vale se esta for a última etapa contratada">suspenso</span>
             <button type="button" class="btn-link" data-ativar-enc="${e.id}" ${trv ? 'disabled' : ''}>ativar aqui</button>`}</div>
      <div></div>
      ${S.map((s) => `<div class="centro">${celulaFixa(v.servicos[s.id] || '', `Encerramento em ${s.sigla}`, 'vale sempre')}</div>`).join('')}
      <div class="centro">${botaoAbre(materiaisDe(v.id).length, chave, aberto, aberto ? 'Fechar' : 'Ver os materiais do Encerramento')}</div>
    </div>${aberto ? `<div class="card__corpo">${ed ? formEvento(v) : infoEvento(v)}${blocoMateriais(v.id, '', false)}</div>` : ''}</div>`;
}

        <div><span class="chip">${escHtml(nomeDe(TIPOS_MAT, m.tipo))}</span></div>
        <div class="mat__nome">${m.modelo_id ? `<a href="#materiais/${m.modelo_id}">${escHtml(mtModelo(m.modelo_id)?.nome || m.nome)}</a> <span class="chip">padrão</span>`
          : m.link ? `<a href="${escHtml(m.link)}" target="_blank" rel="noopener">${escHtml(m.nome)}</a>` : escHtml(m.nome)}</div>
        <div class="mat__tirar">${trv ? '' : `<button type="button" class="btn-link" data-tirar-mat="${m.id}">tirar</button>`}</div>
      </div></div>`).join('')}</div>
    ${trv ? '' : `<div class="mat-novo" data-alvo="${alvo}">

      <input type="url" placeholder="https:// (opcional)" aria-label="Link"><button type="button" class="btn btn--ghost btn--small">+ material</button></div>
      ${mtModelos().some((x) => !ms.some((m) => m.modelo_id === x.id)) ? `<div class="mat-padrao" data-alvo="${alvo}"><select aria-label="Ligar um padrão"><option value="">Ligar um padrão…</option>
        ${mtModelos().filter((x) => !ms.some((m) => m.modelo_id === x.id)).map((x) => `<option value="${x.id}">${escHtml(x.nome)}</option>`).join('')}</select></div>` : ''}`}`;

// "+ Nova etapa" / "+ Nova entrega" / "+ Novo evento": vira um campo ali mesmo e cria na hora
function novoInline(tipo, grupo, rotulo, servico = '') {
  return `<div class="novo-inline" data-novo="${tipo}" data-grupo="${grupo}"${servico ? ` data-servico="${servico}"` : ''}><button type="button" class="novo-inline__btn">${escHtml(rotulo)}</button></div>`;
}
function abrirNovo(box) {
  const tipo = box.dataset.novo;
  const ph = { etapa: 'Nome da etapa', entregavel: 'Texto da entrega (como vai no contrato)', evento: 'Nome do evento' }[tipo];
  box.classList.add('is-aberto');
  box.innerHTML = `<div class="novo-inline__form">${tipo === 'etapa' ? '<input class="novo-sigla" placeholder="Sigla" maxlength="4" aria-label="Sigla">' : ''}
    ${tipo === 'evento' ? `<select class="novo-tipo" aria-label="Tipo">${opcoes(TIPOS_EVT, 'reuniao')}</select>` : ''}
    <input class="novo-nome" placeholder="${ph}" aria-label="Nome">
    <button type="button" class="btn btn--ghost btn--small">Criar</button><button type="button" class="btn-link">cancelar</button></div>`;
  const [criar, cancelar] = box.querySelectorAll('button');
  const nome = box.querySelector('.novo-nome'); const sigla = box.querySelector('.novo-sigla'); const tipoEvt = box.querySelector('.novo-tipo');
  (sigla || nome).focus();
  cancelar.onclick = () => desenharPlano();
  const enviar = async () => {
    if (!nome.value.trim() || (sigla && !sigla.value.trim())) return aviso(tipo === 'etapa' ? 'Dê sigla e nome à etapa.' : tipo === 'evento' ? 'Dê um nome ao evento.' : 'Escreva o texto da entrega.');
    criar.disabled = true;
    try {
      const f = filtro();
      // na ilha, o que nasce é do dono da etapa (P); no fluxo, vem marcado no serviço do filtro
      const dono = tipo === 'etapa' ? box.dataset.servico : etapaDe(box.dataset.grupo)?.servico_id;
      const servicos = dono ? { servicos: { [dono]: 'P' } } : f.srv ? { servicos: { [f.srv]: 'P' } } : {};
      const r = tipo === 'etapa'
        ? await Universo.criar('pgt-etapas', { fase_id: box.dataset.grupo, sigla: sigla.value.trim().toUpperCase(), nome: nome.value.trim(), ...(dono ? { servico_id: dono } : {}) })
        : tipo === 'evento'
          ? await Universo.criar('pgt-eventos', { etapa_id: box.dataset.grupo, nome: nome.value.trim(), tipo: tipoEvt.value,
            cliente: ['reuniao', 'apresentacao', 'aprovacao', 'visita'].includes(tipoEvt.value) ? 1 : 0,
            tempo: tipoEvt.value === 'aprovacao' ? 'cliente' : ['ajuste', 'revisao'].includes(tipoEvt.value) ? 'estudio' : 'pontual', ...servicos })
          : await Universo.criar('pgt-entregaveis', { etapa_id: box.dataset.grupo, texto: nome.value.trim(), ...servicos });
      if (tipo === 'etapa' && r?.id) { ABERTOS.add(r.id); guardarAbertos(); }
      aviso(''); await recarregar();
    } catch (err) { aviso(mensagemDe(err)); criar.disabled = false; }
  };
  criar.onclick = enviar;
  box.querySelectorAll('input').forEach((i) => i.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') enviar(); if (ev.key === 'Escape') desenharPlano(); }));
}

function ligarPlano(el) {
  ligarDecisao(el);
  const naoAbre = (ev) => ev.target.closest('button, a, input, select, textarea, label, .info');
  el.querySelectorAll('[data-abre]').forEach((b) => b.onclick = (ev) => { ev.stopPropagation(); alternarAberto(b.dataset.abre); });
  el.querySelectorAll('[data-abre-linha]').forEach((l) => l.addEventListener('click', (ev) => { if (!naoAbre(ev)) alternarAberto(l.dataset.abreLinha); }));
  // ✎ e cadeado
  el.querySelectorAll('[data-editar]').forEach((b) => b.onclick = (ev) => {
    ev.stopPropagation();
    const id = b.dataset.editar;
    if (EDITANDO.has(id)) EDITANDO.delete(id);
    else {
      EDITANDO.add(id);
      if (!id.startsWith('pfa')) { const r = registroEm(D, id); ABERTOS.add(r?.encerramento ? `${id}@${r.etapa_id}` : id); guardarAbertos(); }
    }
    desenharPlano();
    const campo = document.querySelector(`[data-campo-de="${id}"]`);
    if (campo && EDITANDO.has(id)) campo.focus();
  });
  el.querySelectorAll('[data-editar-texto]').forEach((t) => t.onclick = () => {
    const id = t.dataset.editarTexto;
    if (travado(id)) return;
    EDITANDO.add(id); desenharPlano();
    const campo = document.querySelector(`[data-campo-de="${id}"][data-campo="${t.tagName === 'H3' ? 'nome' : 'descricao'}"]`);
    if (campo) campo.focus();
  });
  el.querySelectorAll('[data-travar]').forEach((b) => b.onclick = (ev) => {
    ev.stopPropagation();
    const id = b.dataset.travar;
    EDITANDO.delete(id);
    mudar({ tipo: 'ed', id, campos: { travado: registroEm(D, id).travado ? 0 : 1 } }, { redesenhar: true });
  });
  // campos editáveis (vão para a fila)
  el.querySelectorAll('[data-campo-de]').forEach((c) => {
    if (c.tagName === 'TEXTAREA') { autoAltura(c); c.addEventListener('input', () => autoAltura(c)); }
    c.addEventListener('input', () => {
      const v = c.value.trim();
      if (['nome', 'sigla', 'texto'].includes(c.dataset.campo) && !v) return;   // obrigatórios: espera ter texto
      mudar({ tipo: 'ed', id: c.dataset.campoDe, campos: { [c.dataset.campo]: c.dataset.campo === 'sigla' ? v.toUpperCase() : (v || null) } });
    });
    if (c.tagName === 'INPUT') c.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') { EDITANDO.delete(c.dataset.campoDe); ordenar(D); derivar(D); desenhar(); } });
  });
  el.querySelectorAll('[data-campo-sel]').forEach((c) => c.onchange = () =>
    mudar({ tipo: 'ed', id: c.dataset.campoSel, campos: { [c.dataset.campo]: c.value } }, { redesenhar: true }));
  el.querySelectorAll('[data-campo-num]').forEach((c) => c.onchange = () => {
    const n = c.value === '' ? null : Math.max(1, Math.min(99, Math.round(Number(c.value))));
    mudar({ tipo: 'ed', id: c.dataset.campoNum, campos: { [c.dataset.campo]: Number.isFinite(n) ? n : null } }, { redesenhar: true });
  });
  el.querySelectorAll('[data-campo-sn]').forEach((c) => c.onchange = () =>
    mudar({ tipo: 'ed', id: c.dataset.campoSn, campos: { [c.dataset.campo]: c.checked ? 1 : 0 } }, { redesenhar: true }));
  el.querySelectorAll('[data-inst]').forEach((c) => c.onchange = () => {
    const enc = ENC();
    const inst = D.etapas.map((e) => e.id).filter((id) => id === enc.etapa_id || el.querySelector(`[data-inst="${id}"]`)?.checked);
    mudar({ tipo: 'ed', id: enc.id, campos: { instancias: inst } }, { redesenhar: true });
  });
  el.querySelectorAll('[data-ativar-enc]').forEach((b) => b.onclick = (ev) => {
    ev.stopPropagation();
    const enc = ENC();
    ABERTOS.delete(`${enc.id}@${enc.etapa_id}`);
    mudar({ tipo: 'ed', id: enc.id, campos: { etapa_id: b.dataset.ativarEnc } }, { redesenhar: true });
  });
  el.querySelectorAll('[data-cat-de]').forEach((c) => c.onchange = () => {
    const id = c.dataset.catDe;
    mudar({ tipo: 'ct', ent: id, ids: [...el.querySelectorAll(`[data-cat-de="${id}"]:checked`)].map((x) => x.value) });
  });
  // entregas e eventos: células, prazo, pessoas, prazo fixo, correr junto
  el.querySelectorAll('.pert[data-ent]').forEach((b) => b.onclick = () => {
    const x = entDe(b.dataset.ent);
    mudar({ tipo: 'pn', ent: x.id, srv: b.dataset.srv, p: proximaPert(x.servicos[b.dataset.srv] || '') }, { redesenhar: true });
  });
  el.querySelectorAll('.pert[data-evt]').forEach((b) => b.onclick = () => {
    const v = evtDe(b.dataset.evt);
    mudar({ tipo: 'pe', ev: v.id, srv: b.dataset.srv, p: proximaPert(v.servicos[b.dataset.srv] || '') }, { redesenhar: true });
  });
  el.querySelectorAll('[data-prazo]').forEach((s) => s.onchange = () =>
    mudar({ tipo: 'ed', id: s.dataset.prazo, campos: { prazo_turnos: s.value ? Number(s.value) : null } }, { redesenhar: true }));
  el.querySelectorAll('[data-pessoas]').forEach((s) => s.onchange = () =>
    mudar({ tipo: 'ed', id: s.dataset.pessoas, campos: { pessoas: Number(s.value) } }, { redesenhar: true }));
  el.querySelectorAll('[data-fixo]').forEach((b) => b.onclick = () => {
    const x = entDe(b.dataset.fixo);
    mudar({ tipo: 'ed', id: x.id, campos: { prazo_fixo: x.prazo_fixo ? 0 : 1 } }, { redesenhar: true });
  });
  el.querySelectorAll('[data-junto]').forEach((b) => b.onclick = () => {
    const x = entDe(b.dataset.junto);
    if (!x.podeJuntar) return;   // a cabeça do grupo sem entrega logo acima: só mostra
    mudar({ tipo: 'ed', id: x.id, campos: { junto_anterior: x.junto_anterior ? 0 : 1 } }, { redesenhar: true });
  });
  // criar / arquivar (na hora)
  el.querySelectorAll('.novo-inline__btn').forEach((b) => b.onclick = () => abrirNovo(b.parentElement));
  el.querySelectorAll('[data-arquivar]').forEach((b) => b.onclick = async () => {
    const id = b.dataset.arquivar;
    const r = registroEm(D, id);
    if (!confirm(`Arquivar "${r.sigla ? `${r.sigla} · ${r.nome}` : r.texto || r.nome}"? Dá para restaurar depois, no fim da página.`)) return;
    try {
      esquecerDaFila((op) => op.id === id || op.ent === id || op.ev === id);
      await arquivarRegistro(registroEm(D0, id));
      EDITANDO.delete(id); await recarregar();
    } catch (err) { aviso(mensagemDe(err)); }
  });
  el.querySelectorAll('[data-tirar-mat]').forEach((b) => b.onclick = async () => {
    b.disabled = true;
    try { await arquivarRegistro(registroEm(D0, b.dataset.tirarMat)); await recarregar(); } catch (err) { aviso(mensagemDe(err)); b.disabled = false; }
  });
  el.querySelectorAll('.mat-padrao select').forEach((sel) => sel.onchange = async () => {
    const x = mtModelo(sel.value); if (!x) return;
    sel.disabled = true;
    try { await Universo.criar('pgt-materiais', { alvo_id: sel.closest('.mat-padrao').dataset.alvo, modelo_id: x.id, tipo: x.tipo, nome: x.nome }); await recarregar(); }
    catch (err) { aviso(mensagemDe(err)); sel.disabled = false; }
  });
  el.querySelectorAll('.mat-novo').forEach((box) => {
    const [tipo, nome, link] = box.querySelectorAll('select, input');
    const enviar = async () => {
      if (!nome.value.trim()) { nome.focus(); return aviso('Dê um nome ao material.'); }
      box.querySelector('button').disabled = true;
      try {
        await Universo.criar('pgt-materiais', { alvo_id: box.dataset.alvo, tipo: tipo.value, nome: nome.value.trim(), link: link.value.trim() || null });
        aviso(''); await recarregar();
      } catch (err) { aviso(mensagemDe(err)); box.querySelector('button').disabled = false; }
    };
    box.querySelector('button').onclick = enviar;
    [nome, link].forEach((i) => i.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') enviar(); }));
  });
  ligarArraste(el);
}
const autoAltura = (t) => { t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; };

// ---------------------------------------------------------------- arrastar cartões
// Etapa em qualquer fase (ou nas avulsas); entrega ou evento em qualquer etapa aberta (a sequência é uma só);
// material em qualquer cartão aberto. Travados não se movem nem recebem. O Encerramento não se arrasta:
// muda de etapa pelo "ativar aqui".
const ARR = { item: null, alca: null, marca: null };   // estado do arraste (um só por página)
const pilhaDe = (id) => ehPasso(id) ? 'seq' : tabelaDe(id);
function ligarArraste(raiz) {
  raiz.querySelectorAll('.card[draggable]').forEach((c) => {
    c.addEventListener('dragstart', (ev) => {
      if (ev.target !== c) return;                        // é um cartão de dentro: ele cuida de si
      if (ARR.alca !== c) { ev.preventDefault(); return; }
      ARR.item = { id: c.dataset.card, pilha: pilhaDe(c.dataset.card) };
      c.classList.add('arrastando');
      ev.dataTransfer.effectAllowed = 'move';
      ev.dataTransfer.setData('text/plain', ARR.item.id);
    });
    c.addEventListener('dragend', (ev) => { if (ev.target !== c) return; c.classList.remove('arrastando'); ARR.item = null; ARR.marca?.remove(); });
  });
  raiz.querySelectorAll('.alca').forEach((b) => b.addEventListener('keydown', (ev) => {
    if (!ev.altKey || (ev.key !== 'ArrowUp' && ev.key !== 'ArrowDown')) return;
    ev.preventDefault();
    const id = b.dataset.alca;
    const grupo = registroEm(D, id)[PAI[tabelaDe(id)]];
    const ids = ehPasso(id) ? D.seq[grupo].map((y) => y.id) : listaDe(D, tabelaDe(id)).filter((y) => y[PAI[tabelaDe(id)]] === grupo).map((y) => y.id);
    const i = ids.indexOf(id); const j = i + (ev.key === 'ArrowUp' ? -1 : 1);
    if (j < 0 || j >= ids.length) return;
    ids.splice(i, 1); ids.splice(j, 0, id);
    mover(id, grupo, ids);
  }));
  if (raiz.dataset.arrasteLigado) return;   // o resto fica no contêiner, que não é redesenhado
  raiz.dataset.arrasteLigado = '1';
  ARR.marca = document.createElement('div');
  ARR.marca.className = 'solta-marca';
  raiz.addEventListener('pointerdown', (ev) => { const a = ev.target.closest('.alca'); ARR.alca = a ? a.closest('.card') : null; });
  const alvo = (ev) => {
    const arr = ARR.item;
    if (!arr) return null;
    let p = ev.target.closest(`[data-pilha="${arr.pilha}"]`);
    if (!p && arr.pilha === 'pgt_etapas') { const fase = ev.target.closest('.fase'); p = fase ? fase.querySelector(':scope > [data-pilha="pgt_etapas"]') : null; }
    if (!p || travado(p.dataset.grupo)) return null;
    if (p.closest(`.card[data-card="${arr.id}"]`)) return null;   // dentro de si mesmo
    const filhos = [...p.children].filter((x) => x.classList.contains('card') && x.dataset.card !== arr.id);
    let i = filhos.findIndex((x) => { const r = x.getBoundingClientRect(); return ev.clientY < r.top + Math.min(r.height / 2, 22); });
    if (i < 0) i = filhos.length;
    return { p, filhos, i };
  };
  raiz.addEventListener('dragover', (ev) => {
    const a = alvo(ev);
    if (!a) return;
    ev.preventDefault();
    ev.dataTransfer.dropEffect = 'move';
    if (a.i < a.filhos.length) a.p.insertBefore(ARR.marca, a.filhos[a.i]); else a.p.appendChild(ARR.marca);
  });
  raiz.addEventListener('dragleave', (ev) => { if (!raiz.contains(ev.relatedTarget)) ARR.marca.remove(); });
  raiz.addEventListener('drop', (ev) => {
    const a = alvo(ev);
    ARR.marca.remove();
    if (!a) return;
    ev.preventDefault();
    const ids = a.filhos.map((x) => x.dataset.card);
    ids.splice(a.i, 0, ARR.item.id);
    const id = ARR.item.id;
    ARR.item = null;
    mover(id, a.p.dataset.grupo, ids);
  });
}
function mover(id, grupo, ids) {
  const tabela = tabelaDe(id);
  const origem = registroEm(D, id)[PAI[tabela]];
  if (ehPasso(id)) {
    // com filtro a pilha mostra só parte da sequência: os que não aparecem ficam onde estavam, no fim
    const resto = (D.seq[grupo] || []).map((y) => y.id).filter((y) => !ids.includes(y) && y !== id);
    if (origem !== grupo) {
      mudar({ tipo: 'ed', id, campos: { etapa_id: grupo } });
      mudar({ tipo: 'sq', grupo: origem, ids: D.seq[origem].map((y) => y.id).filter((y) => y !== id) });
    }
    mudar({ tipo: 'sq', grupo, ids: [...ids, ...resto] });
  } else {
    if (origem !== grupo) {
      mudar({ tipo: 'ed', id, campos: { [PAI[tabela]]: grupo } });
      mudar({ tipo: 'or', tabela, grupo: origem, ids: listaDe(D, tabela).filter((y) => y[PAI[tabela]] === origem && y.id !== id).map((y) => y.id) });
    }
    mudar({ tipo: 'or', tabela, grupo, ids });
  }
  ordenar(D); derivar(D); desenhar();
  const nb = document.querySelector(`.alca[data-alca="${id}"]`); if (nb) nb.focus();
}

// ---------------------------------------------------------------- materiais (visão geral)
const alvoNome = (id) => {
  const e = etapaDe(id); if (e) return `${e.sigla} · ${e.nome}`;
  const x = entDe(id) || evtDe(id); return x ? `${x.codigo} · ${x.texto || x.nome}` : id;
};
function montarFiltroAlvo(valor) {
  const sel = document.getElementById('f-alvo');
  const v = valor !== undefined ? valor : sel.value;
  const n = (id) => materiaisDe(id).length;
  const enc = ENC();
  sel.innerHTML = `<option value="">Todos os materiais (${D.materiais.length})</option>` + D.etapas.map((e) =>
    `<optgroup label="${escHtml(e.sigla + ' · ' + e.nome)}"><option value="${e.id}">${escHtml(e.sigla)} (a etapa) · ${n(e.id)}</option>
      ${D.seq[e.id].map((x) => `<option value="${x.id}">${escHtml(x.codigo + ' · ' + (x.texto || x.nome))} · ${n(x.id)}</option>`).join('')}</optgroup>`).join('')
    + (enc ? `<optgroup label="Encerramento"><option value="${enc.id}">ENC · ${escHtml(enc.nome)} · ${n(enc.id)}</option></optgroup>` : '');
  sel.value = v;
  if (sel.value !== v) sel.value = '';
}
// leva ao cartão no plano, abrindo o que for preciso
function irAoCartao(id) {
  const x = entDe(id) || evtDe(id);
  const e = x ? etapaDe(x.etapa_id) : etapaDe(id);
  if (e) ABERTOS.add(e.id);
  if (x) ABERTOS.add(x.encerramento ? `${x.id}@${x.etapa_id}` : x.id);
  guardarAbertos();
  irPara(e?.servico_id ? 'ilhas' : 'fluxo', { cartoes: true });
  const c = document.querySelector(x?.encerramento ? `[data-card-enc="${x.etapa_id}"]` : `[data-card="${id}"]`);
  if (c) { c.scrollIntoView({ behavior: 'smooth', block: 'center' }); c.classList.add('destaque'); setTimeout(() => c.classList.remove('destaque'), 1600); }
}
// desenharMateriais (padrões e materiais com link): pgt-materiais.js

// ---------------------------------------------------------------- legenda, filtros, abas
const exPert = (p) => celulaPert(p, 'exemplo', 'tabindex="-1" aria-hidden="true"');
document.getElementById('legenda-pert').innerHTML = `<span>${exPert('P')} vem marcado</span>
  <span>${exPert('O')} opcional (disponível, desmarcado)</span>
  <span>${exPert('')} não se aplica</span>
  <span>${exPert('S')} perpétuo (vale sempre)</span>
  <span>${celulaFixa('P', 'exemplo')} ${celulaFixa('O', 'exemplo')} na etapa: vem das entregas</span>
  <span class="legenda-amostra legenda-amostra--evt">evento</span>
  <span class="legenda-amostra legenda-amostra--enc">encerramento</span>
  <span class="legenda-icone"><span class="junto is-cabeca" aria-hidden="true">${ICONE.junto}</span><span class="junto is-on" aria-hidden="true">${ICONE.junto}</span> correm juntas (a primeira no tom forte; as ligadas abaixo, no tom sutil)</span>
  <span class="legenda-icone">${ICONE.fixo} prazo fixo (mais pessoas não encurtam)</span>
  <span class="legenda-icone">${ICONE.cliente} com o cliente</span>
  <span class="legenda-icone">${ICONE.terceiros} com terceiros</span>
  <span class="legenda-icone">${ICONE.decisao} evento de decisão (os relacionados ficam suspensos)</span>
  <span class="legenda-icone"><b>§</b> tem cláusula</span>`;
function aplicarFiltros() {
  if (!D) return;
  document.getElementById('f-todos-rot').hidden = !filtro().srv;
  document.getElementById('f-limpar').hidden = !filtrando();
  desenharPlano(); desenharMateriais();
}
['f-servico', 'f-etapa', 'f-todos'].forEach((id) => document.getElementById(id).onchange = aplicarFiltros);
document.getElementById('f-texto').oninput = aplicarFiltros;
document.getElementById('f-limpar').onclick = () => {
  ['f-servico', 'f-etapa', 'f-texto'].forEach((id) => { document.getElementById(id).value = ''; });
  document.getElementById('f-todos').checked = false;
  aplicarFiltros();
};
document.getElementById('f-alvo').onchange = () => desenharMateriais();
iniciarRotas();
carregar();
carregarBases();
</script>
