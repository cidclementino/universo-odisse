name = "universo-hub"
main = "index.js"
compatibility_date = "2026-07-01"

# KPIs (Cid, 19/11): todo dia às 06:47 de Brasília (depois da coleta do Instagram, 06:17) guarda os números
# de ontem do Instagram e do site; no dia 1º fecha o balanço do mês anterior (worker/kpis.js).
[triggers]
crons = ["47 9 * * *"]

# Os secrets (UNIVERSO_SENHA, MAQUINA_TOKEN, MARCA_GITHUB_TOKEN) são enviados pelo GitHub Actions
# a partir dos secrets do repositório — nunca coloque os valores aqui.

# --- dados (ligados pelo workflow; ver .github/workflows/worker.yml) ---
# Banco D1 "universo". O workflow cria o banco na primeira vez, troca o marcador
# abaixo pelo id verdadeiro e aplica as migrações de dados/migracoes antes de publicar.
[[d1_databases]]
binding = "DB"
database_name = "universo"
database_id = "__D1_ID__"
migrations_dir = "../dados/migracoes"

# R2 privado com os arquivos (documentos e acervo de mídias). Criado pelo workflow.
[[r2_buckets]]
binding = "ARQUIVOS"
bucket_name = "universo-arquivos"
# --- fim dos dados ---

# Site odisse.com.br: o hub pede a regeneração das páginas estáticas quando a equipe muda
# (ponto de entrada "Universo" do Worker site-odisse, método gerar).
[[services]]
binding = "SITE_ODISSE"
service = "site-odisse"
entrypoint = "Universo"

# Início (Cid, 19/11): o panorama do dia vem das outras ferramentas, Worker a Worker (ponto de entrada
# "Universo" de cada uma; ver worker/inicio.js). O SITE_ODISSE acima também dá as métricas do site.
[[services]]
binding = "RADAR"
service = "radar-odisse"
entrypoint = "Universo"

[[services]]
binding = "MARKETING"
service = "universo-odisse" # Worker do marketing.odisse (nome antigo; renomear para marketing-odisse)
entrypoint = "Universo"
