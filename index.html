<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Universo — Odisse</title>
<link rel="icon" href="https://marca.odisse.com.br/favicon/favicon.svg" type="image/svg+xml">
<link rel="icon" href="https://marca.odisse.com.br/favicon/favicon-32x32.png" sizes="32x32">
<link rel="apple-touch-icon" href="https://marca.odisse.com.br/favicon/apple-touch-icon.png">
<link rel="stylesheet" href="https://marca.odisse.com.br/v1/marca.css">
<link rel="stylesheet" href="base/v1/universo.css">
<style>
  .hub { max-width: 1120px; margin: 0 auto; padding: var(--u-esp-7) var(--u-esp-6) 96px; }
  .hub-cab { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--u-esp-5);
    padding-bottom: var(--u-esp-5); border-bottom: 1px solid var(--u-linha-forte); }
  .hub-cab p { margin: 6px 0 0; max-width: 560px; }
  .hub-data { text-align: right; white-space: nowrap; }
  .grupo { margin-top: var(--u-esp-7); }
  .grupo > .u-rotulo { display: block; margin-bottom: var(--u-esp-3); }
  .cartoes { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: var(--u-esp-3); }
  .ferr { display: flex; flex-direction: column; gap: 6px; min-height: 128px; color: inherit; text-decoration: none;
    transition: border-color .15s, transform .15s; }
  a.ferr:hover { border-color: var(--u-tinta-2); transform: translateY(-1px); }
  .ferr-topo { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--u-esp-2); }
  .ferr b { font-size: 15px; font-weight: 650; letter-spacing: -.01em; }
  .ferr p { margin: 0; color: var(--u-tinta-2); font-size: 13px; line-height: 1.45; }
  .ferr .host { margin-top: auto; font-size: 11.5px; color: var(--u-tinta-2); opacity: .8; }
  .ferr.breve { background: transparent; border-style: dashed; }
  .ferr.breve b, .ferr.breve p { opacity: .6; }
  .vazio { padding: var(--u-esp-6) 0; }
  @media (max-width: 640px) {
    .hub { padding: var(--u-esp-5) var(--u-esp-4) 64px; }
    .hub-cab { flex-direction: column; align-items: flex-start; }
    .hub-data { text-align: left; }
    .ferr { min-height: 0; }
  }
</style>
</head>
<body class="u-pagina">
  <div data-universo-barra></div>

  <main class="hub">
    <div class="hub-cab">
      <div>
        <h1 class="u-titulo">Universo</h1>
        <p class="u-apoio">Todas as ferramentas do Odisse num só lugar. As internas pedem a própria senha, por enquanto.</p>
      </div>
      <div class="hub-data u-apoio" id="hoje"></div>
    </div>
    <div id="grupos"><p class="u-apoio vazio">Carregando ferramentas…</p></div>
  </main>

<script src="base/v1/barra.js" defer></script>
<script>
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  document.getElementById('hoje').textContent = new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });

  fetch('ferramentas.json', { cache: 'no-cache' }).then((r) => r.json()).then((d) => {
    document.getElementById('grupos').innerHTML = d.grupos.map((g) => {
      const itens = d.ferramentas.filter((f) => f.grupo === g.id);
      if (!itens.length) return '';
      return `<section class="grupo"><span class="u-rotulo">${esc(g.nome)}</span><div class="cartoes">` +
        itens.map((f) => {
          const breve = f.status === 'em-breve' || !f.url;
          const tag = breve ? '<span class="u-etiqueta suave">em breve</span>'
            : f.acesso === 'publica' ? '<span class="u-etiqueta">público</span>' : '';
          const host = f.url ? f.url.replace(/^https?:\/\/(www\.)?/, '').replace(/\/$/, '') : '';
          const corpo = `<div class="ferr-topo"><b>${esc(f.nome)}</b>${tag}</div><p>${esc(f.descricao)}</p>${host && !breve ? `<span class="host">${esc(host)}</span>` : ''}`;
          return breve
            ? `<div class="u-cartao ferr breve">${corpo}</div>`
            : `<a class="u-cartao ferr" href="${esc(f.url)}">${corpo}</a>`;
        }).join('') + '</div></section>';
    }).join('');
  }).catch(() => {
    document.getElementById('grupos').innerHTML = '<p class="u-apoio vazio">Não foi possível carregar a lista de ferramentas.</p>';
  });
</script>
</body>
</html>
